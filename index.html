<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pranay Reddy — AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #fafafa;
      --text: #111;
      --text-muted: #999;
      --border: #e8e8e8;
      --user-bg: #111;
      --user-text: #fff;
      --ai-bg: #f0f0f0;
      --ai-text: #111;
      --accent: #111;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 640px;
      margin: 0 auto;
    }

    /* Header */
    header {
      padding: 24px 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .name {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .online {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 300;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #22c55e;
      border-radius: 50%;
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 0; }

    /* Welcome */
    .welcome {
      margin: auto;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .welcome h2 {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: -0.02em;
    }

    .welcome p {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 300px;
      line-height: 1.6;
    }

    .welcome-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
      max-width: 360px;
    }

    .pill {
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 400;
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: #fff;
      color: var(--text);
      cursor: pointer;
      transition: all 0.15s;
    }

    .pill:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    /* Bubbles */
    .msg {
      display: flex;
      flex-direction: column;
      gap: 2px;
      animation: up 0.2s ease;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.6;
      max-width: 78%;
      white-space: pre-wrap;
      word-break: break-word;
      font-weight: 300;
    }

    .bubble.user {
      background: var(--user-bg);
      color: var(--user-text);
      border-radius: 16px 16px 4px 16px;
      align-self: flex-end;
    }

    .bubble.ai {
      background: var(--ai-bg);
      color: var(--ai-text);
      border-radius: 16px 16px 16px 4px;
      align-self: flex-start;
    }

    /* Typing */
    .typing {
      display: none;
      gap: 4px;
      padding: 12px 16px;
      background: var(--ai-bg);
      border-radius: 16px 16px 16px 4px;
      width: fit-content;
      align-items: center;
    }

    .typing.show { display: flex; }

    .typing span {
      width: 5px;
      height: 5px;
      background: #aaa;
      border-radius: 50%;
      animation: blink 1.2s ease-in-out infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.3; }
      40% { opacity: 1; }
    }

    /* Input */
    .input-area {
      padding: 16px 24px 28px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 8px 8px 18px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within { border-color: #ccc; }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 300;
      color: var(--text);
      resize: none;
      line-height: 1.5;
      min-height: 24px;
      max-height: 100px;
      padding: 2px 0;
    }

    textarea::placeholder { color: #bbb; }

    .send-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: opacity 0.15s, transform 0.15s;
    }

    .send-btn:hover { opacity: 0.85; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.25; cursor: not-allowed; transform: none; }

    .send-btn svg { fill: #fff; width: 16px; height: 16px; }

    .hint {
      text-align: center;
      font-size: 11px;
      color: #ccc;
      margin-top: 10px;
      font-weight: 300;
    }
  </style>
</head>
<body>
<div class="layout">

  <header>
    <span class="name">Pranay Reddy · AI</span>
    <div class="online"><div class="dot"></div> Online</div>
  </header>

  <div class="messages" id="messages">
    <div class="welcome" id="welcome">
      <h2>Hi, I'm Pranay's AI</h2>
      <p>Ask about his background, projects, or book a meeting with him.</p>
      <div class="welcome-pills">
        <button class="pill" onclick="quick('Tell me about Pranay')">Background</button>
        <button class="pill" onclick="quick('What projects has Pranay built?')">Projects</button>
        <button class="pill" onclick="quick('Why hire Pranay for AI Engineer?')">Role fit</button>
        <button class="pill" onclick="quick('I want to book a meeting with Pranay')">Book meeting</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <textarea
        id="input"
        rows="1"
        placeholder="Ask anything…"
        onkeydown="handleKey(event)"
        oninput="resize(this)"
      ></textarea>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="hint">RAG-grounded · Pranay's resume & GitHub</div>
  </div>

</div>

<script>
const BACKEND = 'https://pranay-persona-call.onrender.com';

  let history = [];
  let busy = false;

  const msgs    = document.getElementById('messages');
  const input   = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const welcome = document.getElementById('welcome');

  function resize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  }

  function quick(text) { input.value = text; send(); }

  function addBubble(role, text) {
    if (welcome) welcome.style.display = 'none';

    const wrap = document.createElement('div');
    wrap.className = 'msg';

    const b = document.createElement('div');
    b.className = `bubble ${role}`;
    b.textContent = text;

    wrap.appendChild(b);
    msgs.appendChild(wrap);
    msgs.scrollTop = msgs.scrollHeight;
    return b;
  }

  function showTyping() {
    const t = document.createElement('div');
    t.className = 'typing show';
    t.id = 'typing';
    t.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(t);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  async function send() {
    const text = input.value.trim();
    if (!text || busy) return;

    input.value = '';
    input.style.height = 'auto';
    addBubble('user', text);
    history.push({ role: 'user', content: text });

    busy = true;
    sendBtn.disabled = true;
    showTyping();

    try {
      const res = await fetch(`${BACKEND}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, history: history.slice(0, -1) })
      });
      const data = await res.json();
      hideTyping();
      const reply = data.reply || 'Something went wrong.';
      addBubble('ai', reply);
      history.push({ role: 'assistant', content: reply });
      if (history.length > 20) history = history.slice(-20);
    } catch {
      hideTyping();
      addBubble('ai', 'Connection error — is the backend running?');
    }

    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }

  input.focus();
</script>
</body>
</html>
